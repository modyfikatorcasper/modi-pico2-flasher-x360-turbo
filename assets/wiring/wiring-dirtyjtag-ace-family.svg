<text x="48" y="153" fill="#aebfae" font-size="22" font-weight="400">DirtyJTAG preview currently uses xsvftool: SVF / XSVF</text>
<rect x="48" y="200" width="650" height="365" rx="12" fill="#142014" stroke="#395139"/>
<rect x="735" y="200" width="657" height="365" rx="12" fill="#142014" stroke="#395139"/>
<text x="77" y="250" fill="#78f541" font-size="32" font-weight="700">ACE V3 / Xilinx</text>
<text x="77" y="315" fill="#edf4ed" font-size="23" font-weight="400">JTAG: TDI, TDO, TCK, TMS + GND</text>
<text x="77" y="370" fill="#edf4ed" font-size="23" font-weight="400">Use the ACE V3 diagram and timing file.</text>
<text x="77" y="425" fill="#edf4ed" font-size="23" font-weight="400">Software preview: physical tests pending.</text>
<text x="77" y="480" fill="#edf4ed" font-size="23" font-weight="400">Start at 100 kHz; scan IDCODE first.</text>
<text x="762" y="250" fill="#ffdb59" font-size="30" font-weight="700">ACE V3+ / V4 / V5 / Gowin</text>
<text x="762" y="315" fill="#edf4ed" font-size="23" font-weight="400">Different programming pad layout.</text>
<text x="762" y="370" fill="#edf4ed" font-size="23" font-weight="400">.fs programming needs a Gowin backend.</text>
<text x="762" y="425" fill="#edf4ed" font-size="23" font-weight="400">NOT implemented in this preview.</text>
<text x="762" y="480" fill="#edf4ed" font-size="23" font-weight="400">Do not apply ACE V3 wiring by position.</text>
<text x="48" y="628" fill="#edf4ed" font-size="26" font-weight="700">Nie zgadujemy padów Gowin / No unverified Gowin pad positions are shown.</text>
<text x="48" y="681" fill="#aebfae" font-size="22" font-weight="400">Family label alone does not establish a matching timing file, device ID or programming voltage.</text>
<text x="48" y="800" fill="#aebfae" font-size="20" font-weight="400">Physical validation and the separate Gowin integration remain release gates.</text>
<text x="48" y="834" fill="#aebfae" font-size="19" font-weight="400">Schemat połączeń / connection map. Pozycje padów sprawdź dla rewizji / verify pad locations.</text>
<text x="48" y="868" fill="#aebfae" font-size="17" font-weight="400">Reference: consolemods.org/wiki/Xbox_360:Programming_Gowin-based_X360ACE_Chips</text>
