<svg xmlns="http://www.w3.org/2000/svg" width="980" height="170" viewBox="0 0 980 170" role="img" aria-labelledby="title desc">
  <title id="title">Open MODI Pico 2 Flasher X360 TURBO</title>
  <desc id="desc">Green graphical button linking to the public MODI Flasher page</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101611"/>
      <stop offset="1" stop-color="#071008"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
