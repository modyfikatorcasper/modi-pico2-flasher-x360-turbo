    </filter>
  </defs>
  <rect x="4" y="4" width="972" height="162" rx="22" fill="url(#bg)" stroke="#b2f85b" stroke-width="4"/>
  <rect x="27" y="30" width="110" height="110" rx="16" fill="#b2f85b"/>
