  <text x="164" y="112" fill="#b2f85b" font-family="Arial,Segoe UI,sans-serif" font-size="38" font-weight="900" filter="url(#glow)">OPEN MODI PICO 2 FLASHER X360 TURBO</text>
  <text x="164" y="141" fill="#aeb8b0" font-family="Arial,Segoe UI,sans-serif" font-size="18">UF2 • J-RUNNER • WIRING • NAND • BIG BLOCK • eMMC</text>
  <path d="M910 61l28 24-28 24" fill="none" stroke="#b2f85b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
